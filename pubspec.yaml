name: canteen_app
description: A simple canteen ordering app UI built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  geolocator: ^14.1.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/applogo.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/background.jpg
    - assets/icon/applogo.jpeg